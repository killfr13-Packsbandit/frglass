name: Convert workshop video

on:
  push:
    paths:
      - ".github/workflows/convert-workshop-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert MOV to web MP4
        run: |
          ffmpeg -y -i public/workshop/hero.mov \
            -vf "scale=720:-2" \
            -c:v libx264 \
            -preset medium \
            -crf 26 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -map_metadata -1 \
            -an \
            public/workshop/hero.mp4

      - name: Commit optimized video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/workshop/hero.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit."
          else
            git commit -m "Further optimize workshop video"
            git push
          fi
